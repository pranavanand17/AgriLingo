<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgriLingo | Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="dashboard-body">

    <main class="dashboard">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="dashboard-header">

            <a href="{{ url_for('home') }}"
               class="dashboard-logo">

                AgriLingo

            </a>


            <a href="{{ url_for('logout') }}"
               class="dashboard-logout">

                Logout

            </a>

        </header>


        <!-- =========================
             DASHBOARD CONTENT
        ========================== -->

        <section class="dashboard-content">


            <!-- =========================
                 SENSOR CARDS
            ========================== -->

            <div class="sensor-grid">


                <!-- SOIL MOISTURE -->

                <a href="#"
                   class="dashboard-card">

                    <div class="card-number">
                        01
                    </div>

                    <div class="card-content">

                        <h2>
                            Soil Moisture
                        </h2>

                        <p>
                            View soil moisture
                            conditions.
                        </p>

                    </div>

                    <span class="card-arrow">
                        →
                    </span>

                </a>


                <!-- HUMIDITY -->

                <a href="#"
                   class="dashboard-card">

                    <div class="card-number">
                        02
                    </div>

                    <div class="card-content">

                        <h2>
                            Humidity
                        </h2>

                        <p>
                            View current
                            humidity levels.
                        </p>

                    </div>

                    <span class="card-arrow">
                        →
                    </span>

                </a>


                <!-- TEMPERATURE -->

                <a href="#"
                   class="dashboard-card">

                    <div class="card-number">
                        03
                    </div>

                    <div class="card-content">

                        <h2>
                            Temperature
                        </h2>

                        <p>
                            View current
                            temperature.
                        </p>

                    </div>

                    <span class="card-arrow">
                        →
                    </span>

                </a>


            </div>


            <!-- =========================
                 CHATBOT
            ========================== -->

            <section class="chat-section">


                <!-- CHAT MESSAGES -->

                <div id="chat-messages"
                     class="chat-messages">
                </div>


                <div id="voice-results"
                     class="voice-results"
                     aria-live="polite">

                    <p id="voice-status" class="voice-status">Ready for Tamil voice input.</p>

                    <div class="voice-result-row">
                        <span>Tamil transcript</span>
                        <strong id="tamil-transcript">—</strong>
                    </div>

                    <div class="voice-result-row">
                        <span>English translation</span>
                        <strong id="english-translation">—</strong>
                    </div>

                    <div class="voice-result-row">
                        <span>RAG response</span>
                        <strong id="rag-response">—</strong>
                    </div>

                    <div class="voice-result-row">
                        <span>Tamil response</span>
                        <div class="tamil-response-value">
                            <strong id="tamil-response">—</strong>
                            <button
                                id="play-tamil-response"
                                class="play-tamil-button"
                                type="button"
                                title="Play Tamil response"
                                aria-label="Play Tamil response"
                                disabled>
                                🔊
                            </button>
                        </div>
                    </div>

                    <p id="voice-error" class="voice-error" role="alert"></p>
                </div>


                <!-- CHAT INPUT -->

                <div class="chat-input">


                    <input
                        type="text"
                        id="chat-message"
                        placeholder="Ask AgriLingo anything about your farm..."
                        autocomplete="off"
                    >


                    <!-- VOICE BUTTON -->

                    <button
                        class="voice-button"
                        id="voice-button"
                        type="button"
                        title="Speak to AgriLingo">

                        🎙

                    </button>


                    <!-- SEND BUTTON -->

                    <button
                        class="send-button"
                        id="send-button"
                        type="button"
                        title="Send message">

                        ↑

                    </button>


                </div>


                <p class="chat-hint"
                   id="chat-hint">

                    AgriLingo Assistant

                </p>


            </section>


        </section>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        // ==================================================
        // CHAT
        // ==================================================

        async function sendMessage() {

            const input =
                document.getElementById("chat-message");

            const messages =
                document.getElementById("chat-messages");


            const message =
                input.value.trim();


            // Don't send empty messages

            if (!message) {
                return;
            }


            // -------------------------
            // USER MESSAGE
            // -------------------------

            const userMessage =
                document.createElement("div");

            userMessage.className =
                "chat-message user";

            userMessage.textContent =
                message;

            messages.appendChild(userMessage);


            // Clear input

            input.value = "";


            // -------------------------
            // THINKING MESSAGE
            // -------------------------

            const thinking =
                document.createElement("div");

            thinking.className =
                "chat-message assistant";

            thinking.textContent =
                "Thinking...";

            messages.appendChild(thinking);


            messages.scrollTop =
                messages.scrollHeight;


            // -------------------------
            // SEND TO FLASK
            // -------------------------

            try {

                const response =
                    await fetch("/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })

                    });


                const data =
                    await response.json();


                // -------------------------
                // RESPONSE
                // -------------------------

                if (data.response) {

                    thinking.textContent =
                        data.response;

                }

                else if (data.error) {

                    thinking.textContent =
                        data.error;

                }

                else {

                    thinking.textContent =
                        "Something went wrong.";

                }


            }

            catch (error) {

                console.error(
                    "CHAT ERROR:",
                    error
                );

                thinking.textContent =
                    "Unable to connect to AgriLingo.";

            }


            messages.scrollTop =
                messages.scrollHeight;

        }


        // ==================================================
        // ENTER TO SEND
        // ==================================================

        document
            .getElementById("chat-message")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        sendMessage();

                    }

                }
            );


        // ==================================================
        // SEND BUTTON
        // ==================================================

        document
            .getElementById("send-button")
            .addEventListener(
                "click",
                sendMessage
            );


        // ==================================================
        // TAMIL VOICE PIPELINE
        // ==================================================

        let mediaRecorder = null;
        let audioChunks = [];
        let tamilResponseAudio = null;

        const voiceButton = document.getElementById("voice-button");
        const voiceStatus = document.getElementById("voice-status");
        const voiceError = document.getElementById("voice-error");
        const playTamilButton = document.getElementById("play-tamil-response");

        function setVoiceStatus(message) {
            voiceStatus.textContent = message;
        }

        function setVoiceResult(id, value) {
            document.getElementById(id).textContent = value || "—";
        }

        async function startRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                voiceError.textContent = "This browser does not support microphone recording.";
                return;
            }

            voiceError.textContent = "";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.addEventListener("dataavailable", (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                });
                mediaRecorder.addEventListener("stop", () => {
                    stream.getTracks().forEach((track) => track.stop());
                    processRecording();
                });
                mediaRecorder.start();
                voiceButton.classList.add("recording");
                voiceButton.setAttribute("aria-label", "Stop recording");
                voiceButton.title = "Stop recording";
                setVoiceStatus("Listening...");
            } catch (error) {
                voiceError.textContent = "Microphone permission was denied or unavailable.";
                setVoiceStatus("Ready for Tamil voice input.");
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                voiceButton.classList.remove("recording");
                voiceButton.setAttribute("aria-label", "Start recording");
                voiceButton.title = "Speak to AgriLingo";
                setVoiceStatus("Processing...");
            }
        }

        async function processRecording() {
            const mimeType = mediaRecorder.mimeType || "audio/webm";
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            if (!audioBlob.size) {
                voiceError.textContent = "No audio was recorded. Please try again.";
                setVoiceStatus("Ready for Tamil voice input.");
                return;
            }

            const formData = new FormData();
            formData.append("audio", audioBlob, "tamil-question.webm");

            try {
                const response = await fetch("/speech", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if (!response.ok || data.error) {
                    throw new Error(data.error || "Voice processing failed.");
                }

                setVoiceResult("tamil-transcript", data.transcript);
                setVoiceResult("english-translation", data.english_translation);
                setVoiceResult("rag-response", data.rag_response);
                setVoiceResult("tamil-response", data.tamil_response);
                setVoiceStatus("Response ready");
                tamilResponseAudio = new Audio(
                    `data:${data.audio_mime_type};base64,${data.audio}`
                );
                playTamilButton.disabled = false;
                await tamilResponseAudio.play();
            } catch (error) {
                voiceError.textContent = error.message || "Unable to process the voice request.";
                setVoiceStatus("Voice response failed");
            }
        }

        playTamilButton.addEventListener("click", async () => {
            if (!tamilResponseAudio) {
                return;
            }

            voiceError.textContent = "";
            try {
                tamilResponseAudio.currentTime = 0;
                await tamilResponseAudio.play();
            } catch (error) {
                voiceError.textContent = "Unable to play the Tamil response.";
            }
        });

        voiceButton.addEventListener("click", () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                stopRecording();
            } else {
                startRecording();
            }
        });


    </script>


</body>

</html>
